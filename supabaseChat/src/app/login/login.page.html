<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="handleLogin()">
    <ion-item>
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input [(ngModel)]="email" name="email" type="email" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input [(ngModel)]="password" name="password" type="password" required></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top">Iniciar sesión</ion-button>
  </form>

  <ion-item lines="none">
    <ion-label class="ion-text-center">¿No tienes una cuenta?</ion-label>
  </ion-item>

  <ion-button expand="block" fill="outline" (click)="handleSignUp()">Registrarse</ion-button>
</ion-content>
